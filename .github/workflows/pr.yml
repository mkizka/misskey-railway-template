name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "DEBUG: build only the build stage in isolation (no misskey image pull)"
        run: time docker buildx build --target build --build-arg MISSKEY_VERSION=2026.6.0 .
      - run: docker compose up -d
      - run: npx wait-on http://localhost:3000 -t 30s
      - run: docker compose logs misskey --tail=100
        if: failure()
